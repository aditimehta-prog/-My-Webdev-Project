
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITARRA | Donor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"> 
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
        }
        .navbar {
            background-color: #2563eb;
            padding: 15px 30px;
        }
        .navbar-brand {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }
        .navbar-brand:hover {
            color: white;
        }
        .dashboard-heading {
            text-align: center;
            margin-top: 35px;
            margin-bottom: 30px;
        }
        .dashboard-heading h2 {
            font-size: 32px;
            color: #1e293b;
            font-weight: 600;
        }
        .dashboard-heading p {
            color: #64748b;
            font-size: 16px;
        }
        .dashboard {
            max-width: 1250px;
            margin: auto;
            padding: 10px 25px 40px;
        }
        .dashboard-card {
            background-color: white;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            min-height: 245px;
            padding: 25px 15px;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 3px 12px rgba(37, 99, 235, 0.07);
        }
        .dashboard-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.15);
            border-color: #2563eb;
        }
        .card-icon {
            font-size: 58px;
            color: #2563eb;
            margin-bottom: 20px;
            margin-top: 5px;
        }
        .dashboard-card h5 {
            color: #1e293b;
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .dashboard-btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px 20px;
            border-radius: 6px;
            font-size: 15px;
            transition: 0.3s;
        }
        .dashboard-btn:hover {
            background-color: #1d4ed8;
            color: white;
        }
        .logout-btn {
            background-color: #2563eb;
        }
        .logout-btn:hover {
            background-color: #dc2626;
        }
        @media(max-width: 768px) {

            .dashboard-heading h2 {
                font-size: 26px;
            }
            .dashboard {
                padding: 10px 18px 30px;
            }
            .dashboard-card {
                min-height: 220px;
            }
        }
    </style>
    <script>
        function dologout() {
            localStorage.removeItem("activeuser");
            location.href = "/Home-page";
        }
    </script>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-heart-pulse"></i>
                VITARRA
            </a>
        </div>
    </nav>
    <!-- DASHBOARD HEADING -->
    <div class="dashboard-heading">
        <h2>Donor Dashboard</h2>
        <p>Manage your profile, donations and records.</p>

    </div>
    <div class="dashboard">
        <div class="row g-4">    
            <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="dashboard-card">
                    <div class="card-icon">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <h5>Profile</h5>
                    <a href="donor-registration.html" class="dashboard-btn">
                        Open Profile
                    </a>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="dashboard-card">
                    <div class="card-icon">
                        <i class="fa-solid fa-capsules"></i>
                    </div>
                    <h5>Medicines</h5>
                    <a href="avail-medicine.html" class="dashboard-btn">
                        Avail Medicine
                    </a>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="dashboard-card">
                    <div class="card-icon">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <h5>Equipments</h5>
                    <a href="avail-equipment.html" class="dashboard-btn">
                        Avail Equipment
                    </a>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="dashboard-card">
                    <div class="card-icon">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                    </div>
                    <h5>Equipment Records</h5>
                    <a href="equipment-manager.html" class="dashboard-btn">
                        Manage Equipment
                    </a>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="dashboard-card">
                    <div class="card-icon">
                        <i class="fa-solid fa-file-medical"></i>
                    </div>
                    <h5>Medicine Records</h5>
                    <a href="medicine-manager.html" class="dashboard-btn">
                        Manage Medicines
                    </a>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="dashboard-card">
                    <div class="card-icon">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </div>
                    <h5>Account</h5>
                    <a href="#" onclick="dologout();"
                       class="dashboard-btn logout-btn">
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
