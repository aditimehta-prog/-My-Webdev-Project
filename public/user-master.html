
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VITARRA | User Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
        }

        /* Navbar */
        .navbar {
            background-color: #2563eb;
            padding: 15px 30px;
        }

        .navbar-brand {
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .navbar-brand:hover {
            color: white;
        }

        /* Heading */
        .dashboard-heading {
            text-align: center;
            margin-top: 35px;
            margin-bottom: 25px;
        }

        .dashboard-heading h2 {
            font-size: 32px;
            color: #1e293b;
            font-weight: 600;
        }

        .dashboard-heading p {
            color: #64748b;
            font-size: 16px;
        }

        /* Main Container */
        .main-container {
            max-width: 1150px;
            margin: 25px auto;
            padding: 30px;
            background-color: white;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(37, 99, 235, 0.07);
        }

        /* Show All Button */
        .show-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 15px;
            transition: 0.3s;
        }

        .show-btn:hover {
            background-color: #1d4ed8;
        }

        /* Table Heading */
        .table-title {
            color: #1e293b;
            font-weight: 600;
            margin: 25px 0 20px;
        }

        /* Table */
        .table {
            border: 1px solid #dbeafe;
            vertical-align: middle;
        }

        .table thead th {
            background-color: #2563eb;
            color: white;
            padding: 14px;
            text-align: center;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 13px;
            color: #334155;
            text-align: center;
        }

        .table tbody tr:hover {
            background-color: #eff6ff;
        }

        /* Action Buttons */
        .action-btn {
            padding: 6px 13px;
            border-radius: 5px;
            font-size: 13px;
            margin: 3px;
        }

        /* Responsive */
        @media(max-width: 768px) {

            .main-container {
                margin: 15px;
                padding: 15px;
            }

            .dashboard-heading h2 {
                font-size: 26px;
            }

            .table {
                min-width: 750px;
            }

        }

    </style>

    <script>
        let myModule = angular.module("mouduleKuch", []);
        let myController = myModule.controller("controllerKuch",function ($scope, $http) {
                $scope.jsonAry = [];
                $scope.doShowAll = function () {
                    let url = "/doShowAll";
                    $http.post(url).then(function (resp) {
                        $scope.jsonAry = resp.data;
                    }, function (err) {
                        alert(JSON.stringify(err));
                    });
                };
                $scope.doDelete = function (emailid) {
                    let ans = confirm("Are you sure you want to delete?");
                    if (ans == true) {
                        let url = "/doDelete?txtEmail=" + encodeURIComponent(emailid);
                        $http.get(url).then(function (resp) {
                            alert(JSON.stringify(resp.data));
                            $scope.doShowAll();
                        },function (err) {
                           alert(JSON.stringify(err));
                       });
                    }
                    else {
                        alert("Delete Cancelled");
                    }
                };
                $scope.doBlock = function (emailid) {
                    let url = "/doBlock?txtEmail=" + encodeURIComponent(emailid);
                    $http.get(url).then(function (resp) {
                        alert("User blocked successfully!");
                        $scope.doShowAll();
                    }, function (err) {
                        alert(JSON.stringify(err));
                    });
                };
                $scope.doResume = function (emailid) {
                    let url = "/doResume?txtEmail=" + encodeURIComponent(emailid);
                    $http.get(url).then(function (resp) {
                        alert("User resumed successfully!");
                        $scope.doShowAll();
                    }, function (err) {
                        alert(JSON.stringify(err));
                    });
                };
            }
        );
    </script>

</head>
<body ng-app="mouduleKuch" ng-controller="controllerKuch"ng-init="doShowAll();">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                VITARRA
            </a>
        </div>
    </nav>
    <div class="dashboard-heading">
        <h2>User Master</h2>
        <p>Manage, block, resume and remove registered users.</p>
    </div>
    <div class="main-container">
        <div class="text-center">
            <button type="button" class="show-btn"  ng-click="doShowAll();">
                <i class="fa-solid fa-rotate"></i>
                Show All Records
            </button>
        </div>
        <h4 class="table-title text-center">
            All User Records
        </h4>
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>Sr.No</th>
                        <th>Email-Id</th>
                        <th>User Type</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="obj in jsonAry">
                        <td>{{$index+1}}</td>
                        <td>{{obj.emailid}}</td>
                        <td>{{obj.utype}}</td>
                        <td>
                            <span ng-if="obj.status == 1" class="badge bg-success">
                                Active
                            </span>
                            <span ng-if="obj.status == 0"  class="badge bg-danger">
                                Blocked
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-outline-danger action-btn" ng-click="doDelete(obj.emailid)">
                                Remove
                            </button>
                            <button class="btn btn-outline-warning action-btn"
                                    ng-if="obj.status == 1"
                                    ng-click="doBlock(obj.emailid)">
                                Block
                            </button>
                            <button class="btn btn-outline-success action-btn" ng-if="obj.status == 0"
                                    ng-click="doResume(obj.emailid)">
                                Resume
                            </button>
                        </td>
                    </tr>
                    <tr ng-if="jsonAry.length == 0">
                        <td colspan="5" class="text-center text-muted">
                            No Records Found
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>

</body>
</html>
