<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }

        .main-box {
            max-width: 950px;
            margin: 15px auto;
            border: 2px solid #2563eb;
            background: white;
            min-height: 700px;
        }

        .heading {
            background-color: #2563eb;
            border-bottom: 2px solid #1d4ed8;
            padding: 12px;
            text-align: center;
            color: white;
        }

        .heading h3 {
            font-size: 26px;
            font-weight: bold;
        }

        .form-area {
            padding: 28px;
        }

        .form-label {
            color: #4568ed;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .form-control {
            border: 1px solid #888;
            border-radius: 3px;
            min-height: 42px;
            font-size: 16px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: none;
        }

        .btn-custom {
            background-color: #4962e8;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 18px;
            padding: 10px 12px;
        }

        .btn-custom:hover {
            background-color: #304acb;
            color: white;
        }

        #message {
            font-size: 15px;
        }

        @media (max-width: 576px) {
            .main-box {
                margin: 5px auto;
                min-height: auto;
            }

            .form-area {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-box">
            <div class="heading">
                <h3 class="mb-0">Donor Registration</h3>
            </div>
            <div class="form-area">
                <div id="message" class="alert d-none" role="status"></div>
                <form id="donorForm" method ="post">
                    <!-- Email and Fetch -->
                    <div class="row align-items-end g-3 mb-3">
                        <div class="col-md-7">
                            <label class="form-label" for="emailid">Email ID</label>
                            <input type="email" class="form-control" id="emailid" name="emailid"
                                placeholder="Enter email address" required>
                        </div>
                        <div class="col-md-5">
                            <button type="button" id="fetchBtn" class="btn btn-custom w-100">
                                FETCH
                            </button>
                        </div>
                    </div>
                    <!-- Name and Address -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label" for="name">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="address">Address</label>
                            <input type="text" class="form-control" id="address" name="address">
                        </div>
                    </div>
                    <!-- Aadhaar -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-5">
                            <label class="form-label" for="adhaar">
                                Aadhaar Card No.
                            </label>
                            <input type="text" class="form-control" id="adhaar" name="adhaar" maxlength="12"
                                inputmode="numeric">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="pin">PIN Code</label>
                            <input type="text" class="form-control" id="pin" name="pin" maxlength="6"
                                inputmode="numeric">
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label" for="region">Region</label>
                                <input type="text" class="form-control" id="region" name="region" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="district">District</label>
                                <input type="text" class="form-control" id="district" name="district" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="contact">
                                    Contact Number
                                </label>
                                <input type="tel" class="form-control" id="contact" name="contact" maxlength="10"
                                    inputmode="numeric">
                            </div>
                        </div>
                        <!-- Contact Hours -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="hfrom">
                                    Contact Hours From
                                </label>
                                <select class="form-select" id="hfrom" name="hfrom">
                                    <option value="">Select Start Time</option>
                                    <option value="09:00">9:00 AM</option>
                                    <option value="10:00">10:00 AM</option>
                                    <option value="11:00">11:00 AM</option>
                                    <option value="12:00">12:00 PM</option>
                                    <option value="13:00">1:00 PM</option>
                                    <option value="14:00">2:00 PM</option>
                                    <option value="15:00">3:00 PM</option>
                                    <option value="16:00">4:00 PM</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="hto">
                                    Contact Hours To
                                </label>
                                <select class="form-select" id="hto" name="hto">
                                    <option value="">Select End Time</option>
                                    <option value="10:00">10:00 AM</option>
                                    <option value="11:00">11:00 AM</option>
                                    <option value="12:00">12:00 PM</option>
                                    <option value="13:00">1:00 PM</option>
                                    <option value="14:00">2:00 PM</option>
                                    <option value="15:00">3:00 PM</option>
                                    <option value="16:00">4:00 PM</option>
                                    <option value="17:00">5:00 PM</option>
                                </select>
                            </div>
                        </div>
                        <!-- Buttons -->
                        <div class="row g-3 mt-4">
                            <div class="col-md-4">
                                <button type="submit" id="saveBtn" formaction="/SaveDonarRecord"
                                    class="btn btn-custom w-100">
                                    Save
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button type="submit" id="updateBtn" formaction="UpdateDonarRecord"
                                    class="btn btn-custom w-100">
                                    Update
                                </button>
                            </div>
                        </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        $(document).ready(function () {
            $("#emailid").val(localStorage.getItem("activeuser")).prop("readonly",true);
            //==================================
            $("#fetchBtn").click(function () {
                let obj = {
                    method: "post",
                    url: "/FetchDonarRecord",
                    data: {
                        emailidAjax: $("#emailid").val()
                    }
                }
                $.ajax(obj).then(function (responseJson) {
                    alert(JSON.stringify(responseJson))
                    if (responseJson == "Invalid Id") {
                        alert("Invalid Emailid");
                        return;
                    }
                    $("#name").val(responseJson.pin)//.colName/fieldName
                    $("#address").val(responseJson.address)//.colName/fieldName
                    $("#adhaar").prop("src", responseJson.adhaar);
                    $("#pin").val(responseJson.pin);
                    $("#region").val(responseJson.region);
                    $("#district").val(responseJson.district);
                    $("#contact").val(responseJson.contact);
                    $("#hfrom").val(responseJson.hfrom);
                    $("#hto").val(responseJson.hto);
                }).fail(function (err) {
                    alert(JSON.stringify(err.responseText))
                })
            })
        })
        $("#pin").blur(function () {
            let pin = $("#pin").val();
            if (pin.length == 6) {
                $.get("https://api.postalpincode.in/pincode/" + pin, function (data) {
                    if (data[0].Status == "Success") {
                        $("#region").val(data[0].PostOffice[0].Block);
                        $("#district").val(data[0].PostOffice[0].District);
                    }
                    else {
                        alert("Invalid PIN Code");
                        $("#region").val("");
                        $("#district").val("");
                    }
                }).fail(function () {
                    alert("Unable to fetch PIN Code details");
                });
            }
            else {
                $("#region").val("");
                $("#district").val("");
            }
        });

    </script>
</body>

</html>
