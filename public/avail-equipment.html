<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Equipment</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            padding: 20px;
        }

        .main-box {
            max-width: 1100px;
            margin: 15px auto;
            border: 2px solid #2563eb;
            background-color: white;
        }

        .heading {
            background-color: #2563eb;
            border-bottom: 2px solid #1d4ed8;
            padding: 15px;
            text-align: center;
            color: white;
        }

        .heading h3 {
            margin: 0;
            font-size: 27px;
            font-weight: bold;
        }

        .form-container {
            padding: 30px;
        }

        .form-title {
            text-align: center;
            color: #4568ed;
            font-size: 23px;
            margin-bottom: 25px;
        }

        .image-box {
            border: 2px solid #1d4ed8;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .image-box img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border: 2px solid #1d4ed8;
            margin-bottom: 15px;
        }

        .image-box label {
            color: #4568ed;
            font-size: 18px;
            cursor: pointer;
        }

        .image-box input {
            font-size: 13px;
        }

        .form-fields {
            border: 2px solid #1d4ed8;
            padding: 20px;
        }

        .form-fields label {
            display: block;
            text-align: center;
            color: #4568ed;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .form-fields input,
        .form-fields select {
            margin-bottom: 20px;
            border: 2px solid #1d4ed8;
            border-radius: 0;
            min-height: 45px;
        }

        .avail-btn {
            width: 80%;
            display: block;
            margin: 25px auto 0;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
        }

        .avail-btn:hover {
            background-color: #1d4ed8;
            color: white;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .form-container {
                padding: 15px;
            }

            .image-box {
                min-height: 250px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid">

        <div class="main-box">

            <!-- Heading -->
            <div class="heading">
                <h3> Equipment Availability</h3>
            </div>

            <div class="form-container">

                <h4 class="form-title">
                    Equipment Availability
                </h4>

                <form action="/saveAvailEqu"
                    method="post"
                    enctype="multipart/form-data">

                    <div class="row g-4">

                        <!-- Image Upload -->
                        <div class="col-md-5">

                            <div class="image-box">

                                <img id="preview"
                                    src="https://placehold.co/150x150/ffffff/345da7?text=Image"
                                    alt="Equipment Image">

                                <label for="pic">
                                    Select Image
                                </label>

                                <input type="file"
                                    id="pic"
                                    name="picurl"
                                    accept="image/*"
                                    class="form-control"
                                    required
                                    onchange="previewImage(event)">

                            </div>

                        </div>

                        <!-- Form Fields -->
                        <div class="col-md-7">

                            <div class="form-fields">

                                <label for="emailid">
                                    Donor Email Id
                                </label>

                                <input type="email"
                                    id="emailid"
                                    name="emailid"
                                    class="form-control"
                                    required>

                                <label for="category">
                                    Equipment Category
                                </label>

                                <select id="category"
                                    name="category"
                                    class="form-select"
                                    required>

                                    <option value="">Select Category</option>
                                    <option value="Health Monitors">Health Monitors</option>
                                    <option value="Diabetes Supplies">Diabetes Supplies</option>
                                    <option value="Mobility Aids">Mobility Aids</option>
                                    <option value="Orthopaedic Supports">Orthopaedic Supports</option>
                                    <option value="Posture Correctors">Posture Correctors</option>
                                    <option value="Compression Garments">Compression Garments</option>
                                    <option value="Maternity Belts">Maternity Belts</option>
                                    <option value="First Aid">First Aid and Wound Care</option>

                                </select>

                            </div>

                            <button type="submit" class="btn avail-btn">
                                Avail Now
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script>
        function previewImage(event) {

            const file = event.target.files[0];

            if (file) {
                document.getElementById("preview").src =
                    URL.createObjectURL(file);
            }
        }
    </script>

</body>
</html>
