<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <script>
        let myModule = angular.module("mouduleKuch", []);
        let myController = myModule.controller("controllerKuch", function ($scope, $http) {
            ///====================AJAX==============
            $scope.jsonAry = [];
            $scope.doshowAllEquipment = function () {
                let url = "/doshowAllEquipment?emailid=" + $scope.email;
                $http.post(url).then(function (resp) {
                    // alert(JSON.stringify(resp.data))
                    $scope.jsonAry = resp.data;
                }, function (err) {
                    alert(JSON.stringify(err))
                })
            }
            $scope.doDeleteEquipment = function (rid) {
                let ans = confirm("Are you sure you want to delete?");
                if (ans == true) {
                    let url = "/doDeleteEquipment?rid=" + rid;
                    $http.get(url).then(function (resp) {
                        alert(JSON.stringify(resp.data));
                        $scope.doshowAllEquipment();
                    }, function (err) {
                        alert(JSON.stringify(err));
                    });
                }
                else {
                    alert("Delete Cancelled");
                }
            }
        })
    </script>
</head>

<body ng-app="mouduleKuch" ng-controller="controllerKuch" ng-init="doshowAllEquipment();" class="bg-light">
    <div class="container py-5">
        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                <h3 class="fw-bold mb-0">All Records</h3>
            </div>
            <div class="card-body p-4">
                <div class="row align-items-end g-3 mb-4">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Enter Email</label>
                        <input type="text" ng-model="email" class="form-control form-control-lg"
                            placeholder="Enter Email ID">
                    </div>
                    <div class="col-md-4">
                        <input type="button" class="btn btn-primary btn-lg w-100" value="Show All Records"
                            ng-click="doshowAllEquipment();">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered table-hover table-striped align-middle text-center">
                        <thead class="table-primary">
                            <tr>
                                <th>Sr.No</th>
                                <th>Rid</th>
                                <th>Email-Id</th>
                                <th>Category</th>
                                <th>Picture</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="obj in jsonAry">
                                <td>{{$index+1}}</td>
                                <td>{{obj.rid}}</td>
                                <td>{{obj.emailid}}</td>
                                <td>{{obj.category}}</td>
                                <td>
                                    <img ng-src="{{obj.picurl}}" class="img-thumbnail"
                                        style="width: 100px; height: 100px; object-fit: cover;">
                                </td>
                                <td>
                                    <a href="" class="btn btn-outline-danger btn-sm"
                                        ng-click="doDeleteEquipment(obj.rid)">
                                        Remove
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
