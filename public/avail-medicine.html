<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicine Availability</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            font-family: Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        /* Center the form */
        .main-container {
            min-height: calc(100vh - 40px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-box {
            border: 2px solid #2563eb;
            background: white;
            padding: 25px;
            width: 100%;
        }

        .heading {
            background-color: #2563eb;
            border-bottom: 2px solid #1d4ed8;
            padding: 12px;
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .title {
            text-align: center;
            color: #4568ed;
            margin-bottom: 30px;
        }

        label {
            color: #2563eb;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            border: 2px solid #2563eb;
            border-radius: 0;
            min-height: 43px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 0.15rem rgba(37, 99, 235, 0.15);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .pic-box {
            text-align: center;
            margin: 15px auto;
            max-width: 250px;
        }

        .pic-box img {
            width: 190px;
            height: 220px;
            object-fit: contain;
            border: 2px solid #2563eb;
            display: block;
            margin: 10px auto;
        }

        .pic-box input {
            width: 100%;
        }

        .submit-btn {
            display: block;
            width: 330px;
            max-width: 100%;
            margin: 25px auto 0;
            padding: 12px;
            background: #dce5ed;
            color: #4568ed;
            border: 2px solid #2563eb;
            border-radius: 0;
            font-size: 20px;
        }

        .submit-btn:hover {
            background: #2563eb;
            color: white;
        }

        /* Mobile adjustments */
        @media (max-width: 576px) {
            body {
                padding: 12px;
            }

            .main-container {
                min-height: auto;
            }

            .main-box {
                padding: 15px;
            }

            .heading h3 {
                font-size: 22px;
            }

            label {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid main-container">

        <div class="row w-100 justify-content-center">

            <!-- Centered Medicine Form -->
            <div class="col-lg-9 col-md-11 col-12">

                <div class="main-box">

                    <!-- Heading -->
                    <div class="heading">
                        <h3 class="mb-0">Medicine Availability</h3>
                    </div>

                    <form action="/saveAvailMed"
                        method="post"
                        enctype="multipart/form-data">

                        <!-- Email -->
                        <div class="row form-group">

                            <div class="col-md-6">
                                <label for="emailid">Email ID</label>

                                <input type="email"
                                    name="emailid"
                                    id="emailid"
                                    class="form-control"
                                    placeholder="Enter email ID"
                                    required>
                            </div>

                        </div>

                        <!-- Medicine Name, Power, Company -->
                        <div class="row form-group">

                            <div class="col-md-5">
                                <label for="medecine">Medicine Name</label>

                                <input type="text"
                                    name="medecine"
                                    id="medecine"
                                    class="form-control"
                                    placeholder="Enter medicine name"
                                    required>
                            </div>

                            <div class="col-md-3">
                                <label for="power">Power (mg)</label>

                                <input type="number"
                                    name="power"
                                    id="power"
                                    class="form-control"
                                    placeholder="e.g. 500"
                                    min="0"
                                    step="any"
                                    required>
                            </div>

                            <div class="col-md-4">
                                <label for="company">Company</label>

                                <input type="text"
                                    name="company"
                                    id="company"
                                    class="form-control"
                                    placeholder="Enter company name"
                                    required>
                            </div>

                        </div>

                        <!-- Quantity, Packing, Expiry -->
                        <div class="row form-group">

                            <div class="col-md-3">
                                <label for="qty">Quantity</label>

                                <input type="number"
                                    name="qty"
                                    id="qty"
                                    class="form-control"
                                    placeholder="Enter quantity"
                                    min="1"
                                    step="1"
                                    required>
                            </div>

                            <div class="col-md-3">
                                <label for="packing">Packing</label>

                                <select name="packing"
                                    id="packing"
                                    class="form-select"
                                    required>

                                    <option value="">Select Packing</option>
                                    <option value="Tablet">Tablet</option>
                                    <option value="Capsule">Capsule</option>
                                    <option value="Syrup">Syrup</option>
                                    <option value="Bottle">Bottle</option>
                                    <option value="Strip">Strip</option>
                                    <option value="Box">Box</option>

                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="doexp">Date of Expiry</label>

                                <input type="date"
                                    name="doexp"
                                    id="doexp"
                                    class="form-control"
                                    required>
                            </div>

                        </div>

                        <!-- Medicine Image -->
                        <div class="pic-box">

                            <label for="picurl">Medicine Picture</label>

                            <img id="preview"
                                src="https://placehold.co/190x220/ffffff/405b9a?text=Medicine+Image"
                                alt="Medicine image preview">

                            <input type="file"
                                name="picurl"
                                id="picurl"
                                class="form-control"
                                accept="image/*"
                                required
                                onchange="showImage(event)">

                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn submit-btn" >
                            Avail To NGOs
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script>
        // Preview selected medicine image
        function showImage(event) {
            const file = event.target.files[0];

            if (file) {
                if (!file.type.startsWith("image/")) {
                    alert("Please select a valid image file.");
                    event.target.value = "";
                    return;
                }

                document.getElementById("preview").src =
                    URL.createObjectURL(file);
            }
        }

    </script>

</body>

</html>
